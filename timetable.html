<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CREST Academy — Weekly Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#040714;color:#f1f5f9;font-family:Poppins,Arial,sans-serif}
main{max-width:1100px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
a,.refresh{color:#38bdf8;text-decoration:none;font-weight:600}.refresh{background:#0f172a;border:1px solid #24415c;border-radius:10px;padding:10px 14px;cursor:pointer}
h1{font-size:clamp(22px,4vw,32px);margin:0}.sub{color:#94a3b8;font-size:13px;margin:7px 0 20px}
.panel{background:linear-gradient(145deg,#0b112c,#070b1e);border:1px solid rgba(56,189,248,.18);border-radius:18px;padding:18px;overflow:hidden}
.status{color:#94a3b8;font-size:13px;margin-bottom:14px;white-space:pre-wrap}
.table-wrap{overflow-x:auto}table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px}
th,td{padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07);text-align:center}
th{color:#38bdf8;background:#0e1835}td:first-child,td:nth-child(2){color:#cbd5e1;font-weight:600}
.lesson{display:block;color:#fff;font-weight:700}.teacher,.room{display:block;color:#94a3b8;font-size:11px;margin-top:3px}
.empty{color:#64748b}
@media(max-width:600px){body{padding:16px}.panel{padding:10px}}
</style></head>
<body><main>
<div class="top"><a href="index.html">← Back to CREST Academy</a><button class="refresh" onclick="loadTimetable()">Refresh timetable</button></div>
<h1>Weekly Student Timetable</h1>
<p class="sub">Fixed classes Tuesday to Friday · Six one-hour lessons each day · 08:00–14:00</p>
<section class="panel"><div class="status" id="ttStatus">Loading published timetable…</div>
<div class="table-wrap"><table><thead><tr><th>Period</th><th>Time</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr></thead>
<tbody id="ttBody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody></table></div></section>
</main>
<script>
const SUPABASE_URL='https://otjybdiyoqnsynjbofuj.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90anliZGl5b3Fuc3luamJvZnVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODk1OTgsImV4cCI6MjEwODA2NTU5OH0.itwB7UrJNSNIGj2VN82PniqX9fccquf0d9fBwGB05Jc';
const days=['Tuesday','Wednesday','Thursday','Friday'];
const slots=[{p:1,s:'08:00',e:'09:00'},{p:2,s:'09:00',e:'10:00'},{p:3,s:'10:00',e:'11:00'},{p:4,s:'11:00',e:'12:00'},{p:5,s:'12:00',e:'13:00'},{p:6,s:'13:00',e:'14:00'}];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadTimetable(){
 const status=document.getElementById('ttStatus'),body=document.getElementById('ttBody');status.textContent='Loading published timetable…';
 try{
  const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/crest_timetable_public',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:'{}'});
  const raw=await res.text();let rows;try{rows=JSON.parse(raw)}catch{throw new Error(raw||'Unexpected response')}
  if(!res.ok)throw new Error(rows.message||'Could not load timetable');
  const lookup={};(rows||[]).forEach(r=>{if(days.includes(r.day)&&Number(r.period)>=1&&Number(r.period)<=6)lookup[r.day+'|'+r.period]=r;});
  let html='';
  slots.forEach(slot=>{
   html+='<tr><td>Period '+slot.p+'</td><td>'+slot.s+'–'+slot.e+'</td>'+days.map(day=>{
    const r=lookup[day+'|'+slot.p];return '<td>'+(r?'<span class="lesson">'+esc(r.subject)+'</span>'+(r.teacher?'<span class="teacher">'+esc(r.teacher)+'</span>':'')+(r.room?'<span class="room">'+esc(r.room)+'</span>':''):'<span class="empty">—</span>')+'</td>';
   }).join('')+'</tr>';
  });
  body.innerHTML=html;status.textContent=rows&&rows.some(r=>days.includes(r.day)&&Number(r.period)<=6)?'Showing the published Tuesday–Friday timetable.':'No timetable has been published yet.';
 }catch(e){status.textContent='Unable to load timetable: '+e.message;body.innerHTML='<tr><td colspan="6" class="empty">Please refresh later or contact the administrator.</td></tr>';}
}
loadTimetable();
</script></body></html>
