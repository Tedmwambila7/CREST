```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREST Teacher Login</title>
  <link rel="stylesheet" href="exam.css">
</head>

<body>

  <header>
    <h1>CREST Examination Centre</h1>
  </header>

  <main>
    <section class="card">

      <h2>Teacher / Administrator Login</h2>

      <p class="muted">
        Sign in using your authorised CREST examination account.
      </p>

      <div id="message" class="message" role="status"></div>

      <form id="teacherLoginForm">

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="username"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
        >

        <button type="submit" id="loginButton">
          Sign In
        </button>

      </form>

      <p>
        <a href="index.html">Back to Examination Centre</a>
      </p>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="exam.js"></script>

  <script>
    const form = document.getElementById("teacherLoginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    const CREST = window.CREST_EXAM;

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      button.disabled = true;
      message.textContent = "Checking your login details...";
      message.className = "message info";

      try {

        const client = CREST.getClient();

        const email = form.elements.email.value.trim();
        const password = form.elements.password.value;

        const { error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        const { profile } = await CREST.requireTeacher();

        if (!profile || !["admin", "teacher"].includes(profile.role)) {
          throw new Error("You are not authorised to access the teacher dashboard.");
        }

        message.textContent = "Login successful. Opening dashboard...";
        message.className = "message success";

        window.location.replace("teacher-dashboard.html");

      } catch (error) {

        try {
          await CREST.getClient().auth.signOut();
        } catch (_) {}

        message.textContent = error.message || "Login failed. Please try again.";
        message.className = "message error";

        button.disabled = false;
      }

    });
  </script>

</body>
</html>
```
